<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia — Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #17181b;
  --surface: #202226;
  --surface-2: #2a2c31;
  --line: #34363c;
  --chalk: #eef0ea;
  --chalk-dim: #9a9da5;
  --red: #e8432f;
  --brass: #c9a227;
  --teal: #3fa79b;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--chalk);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}
body { padding-bottom: 90px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px 40px; }
header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px;
  letter-spacing: 1px;
  margin: 0;
  line-height: 0.9;
  border-bottom: 4px solid var(--red);
  padding-bottom: 4px;
}
.date { font-size: 12px; color: var(--chalk-dim); text-transform: uppercase; letter-spacing: 1px; }
.split-note {
  font-size: 12px; color: var(--chalk-dim); margin-bottom: 20px; line-height: 1.5;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ex-name { font-weight: 700; font-size: 16px; }
.ex-meta { font-size: 12px; color: var(--chalk-dim); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.del-btn {
  background: none; border: none; color: var(--chalk-dim); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 4px;
}
.del-btn:hover { color: var(--red); }
.row2 { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.weight-field { display: flex; align-items: center; gap: 6px; }
.weight-field label { font-size: 11px; color: var(--chalk-dim); text-transform: uppercase; }
.weight-field input {
  width: 64px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; color: var(--chalk); padding: 6px 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
}
.sets { display: flex; gap: 8px; margin-left: auto; }
.set-dot {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--chalk-dim);
  transition: all 0.12s ease;
}
.set-dot.done {
  background: var(--red); border-color: var(--red); color: #fff;
  box-shadow: 0 2px 8px rgba(232,67,47,0.4);
}
.empty { text-align: center; color: var(--chalk-dim); padding: 30px 10px; font-size: 14px; }
/* Cardio cards */
.cardio-card {
  background: linear-gradient(135deg, rgba(63,167,155,0.12), var(--surface));
  border: 1px solid var(--teal);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.cardio-left { display: flex; align-items: center; gap: 12px; }
.cardio-check {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--teal); background: var(--surface-2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--teal); flex-shrink: 0;
}
.cardio-check.done { background: var(--teal); color: #0d201d; }
.cardio-title { font-weight: 700; font-size: 15px; }
.cardio-meta { font-size: 12px; color: var(--chalk-dim); }
.cardio-btn {
  background: var(--teal); color: #0d201d; border: none; border-radius: 8px;
  padding: 9px 14px; font-weight: 700; font-size: 12px; cursor: pointer;
}
.section-label {
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
  color: var(--chalk-dim); margin: 20px 0 10px;
}
.add-form {
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; display: none;
}
.add-form.open { display: block; }
.add-form .fields { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.add-form input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; color: var(--chalk); padding: 8px; font-size: 13px;
  font-family: 'Inter', sans-serif;
}
.add-form input::placeholder { color: #6b6d74; }
button.primary, button.ghost {
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
  border-radius: 8px; padding: 10px 16px; cursor: pointer; border: none;
}
button.primary { background: var(--red); color: #fff; }
button.primary:hover { background: #ff5a42; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--chalk); width: 100%; }
button.ghost:hover { border-color: var(--chalk-dim); }
.add-toggle { width: 100%; margin-bottom: 14px; }
.finish {
  width: 100%; margin-top: 6px; padding: 14px;
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
  background: var(--brass); color: #1a1608;
}
.finish:hover { background: #ddb531; }
.last { font-family: 'JetBrains Mono', monospace; }
/* Rest timer bar */
.timer-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  justify-content: center; flex-wrap: wrap;
}
.timer-display {
  font-family: 'JetBrains Mono', monospace; font-size: 22px; min-width: 68px; text-align: center;
  color: var(--chalk);
}
.timer-bar button {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--chalk);
  border-radius: 6px; padding: 8px 10px; font-size: 12px; cursor: pointer; font-weight: 600;
}
.timer-bar button.go { background: var(--red); border-color: var(--red); color: #fff; }
.timer-bar .presets { display: flex; gap: 6px; }
.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--brass); color: #1a1608; padding: 10px 18px; border-radius: 8px;
  font-weight: 700; font-size: 13px; opacity: 0; transition: all 0.25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ex-name { cursor: pointer; }
.ex-name:hover { color: var(--red); }
.photo-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center; z-index: 50;
  padding: 20px;
}
.photo-modal.open { display: flex; }
.photo-modal .box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  max-width: 480px; width: 100%; overflow: hidden;
}
.photo-modal img { width: 100%; display: block; }
.photo-modal .no-photo {
  padding: 40px 20px; text-align: center; color: var(--chalk-dim); font-size: 14px;
}
.photo-modal .cap { padding: 12px 16px; font-weight: 700; font-size: 14px; }
.photo-modal .close-row { padding: 0 16px 16px; }
.history-btn {
  width: 100%; margin-bottom: 14px; background: transparent;
  border: 1px solid var(--line); color: var(--chalk-dim);
  border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.history-btn:hover { border-color: var(--chalk-dim); color: var(--chalk); }
.history-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-start; justify-content: center; z-index: 60;
  padding: 30px 16px;
  overflow-y: auto;
}
.history-modal.open { display: flex; }
.history-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  max-width: 560px; width: 100%; padding: 18px;
}
.history-box h2 {
  font-family: 'Bebas Neue', sans-serif; font-size: 26px; margin: 0 0 14px; letter-spacing: 1px;
}
.hist-empty { color: var(--chalk-dim); font-size: 14px; text-align: center; padding: 30px 10px; }
.hist-item {
  border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden;
}
.hist-head {
  padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; background: var(--surface-2);
}
.hist-date { font-weight: 700; font-size: 14px; text-transform: capitalize; }
.hist-sub { font-size: 11px; color: var(--chalk-dim); margin-top: 2px; }
.hist-arrow { color: var(--chalk-dim); transition: transform 0.15s ease; }
.hist-item.open .hist-arrow { transform: rotate(180deg); }
.hist-body { display: none; padding: 12px 14px; }
.hist-item.open .hist-body { display: block; }
.hist-ex-row {
  display: flex; justify-content: space-between; font-size: 13px;
  padding: 6px 0; border-bottom: 1px solid var(--line);
}
.hist-ex-row:last-child { border-bottom: none; }
.hist-ex-name { color: var(--chalk); }
.hist-ex-detail { color: var(--chalk-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.hist-cardio { font-size: 12px; color: var(--teal); margin-bottom: 8px; }
.user-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  padding: 20px;
}
.user-screen.hidden { display: none; }
.user-box { max-width: 380px; width: 100%; text-align: center; }
.user-box h1 {
  font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 1px;
  border-bottom: 4px solid var(--red); padding-bottom: 8px; margin-bottom: 6px;
}
.user-box .sub { color: var(--chalk-dim); font-size: 13px; margin-bottom: 24px; }
.user-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.user-pick {
  background: var(--surface); border: 1px solid var(--line); color: var(--chalk);
  border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.user-pick:hover { border-color: var(--red); color: var(--red); }
.user-new { display: flex; gap: 8px; }
.user-new input {
  flex: 1; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; color: var(--chalk); padding: 12px; font-size: 14px;
}
.switch-user-link {
  background: none; border: none; color: var(--chalk-dim); font-size: 11px;
  text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px;
}
</style>
</head>
<body>

<div class="user-screen" id="userScreen">
  <div class="user-box">
    <h1>ACADEMIA</h1>
    <div class="sub">Quem está treinando hoje?</div>
    <div class="user-list" id="userList"></div>
    <div class="user-new">
      <input id="newUserName" placeholder="Outro nome...">
      <button class="primary" onclick="submitNewUser()">Entrar</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>ACADEMIA</h1>
    <div style="text-align:right;">
      <div class="date" id="today"></div>
      <button class="switch-user-link" onclick="switchUser()" id="currentUserLabel"></button>
    </div>
  </header>
  <div class="split-note">Mesmo treino de força todos os dias, com esteira no aquecimento e no final.</div>

  <div class="cardio-card">
    <div class="cardio-left">
      <div class="cardio-check" id="warmupCheck" onclick="toggleCardio('warmup')">✓</div>
      <div>
        <div class="cardio-title">Esteira — Aquecimento</div>
        <div class="cardio-meta">5 minutos</div>
      </div>
    </div>
    <button class="cardio-btn" onclick="setTimer(300); toggleTimer();">Iniciar 5 min</button>
  </div>

  <div class="section-label">Exercícios</div>
  <div id="list"></div>

  <div class="add-form" id="addForm">
    <div class="fields">
      <input id="fName" placeholder="Exercício">
      <input id="fSets" type="number" placeholder="Séries" value="3">
      <input id="fReps" type="number" placeholder="Reps" value="10">
      <input id="fWeight" type="number" placeholder="Peso (kg)" value="0">
    </div>
    <button class="primary" onclick="addExercise()">Adicionar</button>
    <button class="ghost" style="width:auto;margin-left:8px;border:none;" onclick="toggleForm(false)">Cancelar</button>
  </div>
  <button class="ghost add-toggle" onclick="toggleForm(true)">+ Adicionar exercício</button>

  <div class="cardio-card">
    <div class="cardio-left">
      <div class="cardio-check" id="cooldownCheck" onclick="toggleCardio('cooldown')">✓</div>
      <div>
        <div class="cardio-title">Esteira — Final</div>
        <div class="cardio-meta">30 minutos</div>
      </div>
    </div>
    <button class="cardio-btn" onclick="setTimer(1800); toggleTimer();">Iniciar 30 min</button>
  </div>

  <button class="finish" onclick="finishSession()">FINALIZAR TREINO</button>
  <button class="history-btn" onclick="openHistory()">📅 Ver histórico de treinos</button>
</div>

<div class="timer-bar">
  <div class="timer-display" id="timerDisplay">01:30</div>
  <div class="presets">
    <button onclick="setTimer(60)">60s</button>
    <button onclick="setTimer(90)">90s</button>
    <button onclick="setTimer(120)">120s</button>
  </div>
  <button class="go" id="timerBtn" onclick="toggleTimer()">Iniciar</button>
  <button onclick="resetTimer()">Reset</button>
</div>

<div class="toast" id="toast">Treino salvo</div>

<div class="photo-modal" id="photoModal" onclick="if(event.target===this) closePhoto()">
  <div class="box">
    <div id="photoContent"></div>
    <div class="cap" id="photoCap"></div>
    <div class="close-row"><button class="ghost" onclick="closePhoto()">Fechar</button></div>
  </div>
</div>

<div class="history-modal" id="historyModal" onclick="if(event.target===this) closeHistory()">
  <div class="history-box">
    <h2>HISTÓRICO</h2>
    <div id="historyList"></div>
    <button class="ghost" onclick="closeHistory()">Fechar</button>
  </div>
</div>

<script>
// URL do Web App do Google Apps Script (backend do histórico)
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwSkbd9Bb0lMko9tnjrhaygjxfJ8wDjc5oin5V5505O4OKMrtH-HPCF-56Cbt5Tccp4Pw/exec';

// ---- storage abstraction: usa window.storage se disponível, senão localStorage ----
const storage = {
  async get(key) {
    if (window.storage) {
      try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  },
  async set(key, value) {
    if (window.storage) {
      try { await window.storage.set(key, JSON.stringify(value)); return; }
      catch (e) { return; }
    }
    localStorage.setItem(key, JSON.stringify(value));
  }
};

function uid() { return Math.random().toString(36).slice(2, 9); }

// ---- Usuário atual ----
let currentUser = localStorage.getItem('currentUser') || null;

async function fetchUsersFromSheet() {
  try {
    const res = await fetch(SHEET_URL + '?type=users');
    if (!res.ok) throw new Error('resposta não ok');
    return await res.json();
  } catch (err) {
    console.error('Falha ao buscar usuários da planilha:', err);
    return ['Daniel', 'Lais', 'Leandro', 'Paula']; // fallback offline
  }
}

async function addUserToSheet(name) {
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'adduser', name })
    });
  } catch (err) {
    console.error('Falha ao registrar novo usuário:', err);
  }
}

async function showUserScreen() {
  const users = await fetchUsersFromSheet();
  const list = document.getElementById('userList');
  list.innerHTML = '';
  users.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'user-pick';
    btn.textContent = name;
    btn.onclick = () => chooseUser(name);
    list.appendChild(btn);
  });
  document.getElementById('userScreen').classList.remove('hidden');
}

async function submitNewUser() {
  const name = document.getElementById('newUserName').value.trim();
  if (!name) return;
  await addUserToSheet(name);
  await chooseUser(name);
}

async function chooseUser(name) {
  currentUser = name;
  localStorage.setItem('currentUser', name);
  document.getElementById('userScreen').classList.add('hidden');
  document.getElementById('currentUserLabel').textContent = 'Trocar usuário (' + name + ')';
  await loadUserData();
}

function switchUser() {
  showUserScreen();
}

// Mapa: nome exato do exercício -> caminho da foto (arquivo na raiz do repositório, ao lado do index.html)
const PHOTOS = {
  'Back Extension (lombar)': 'back-extension.jpg',
  'Dip Machine (tríceps/peito)': 'dip-machine.jpg',
  'Lat Pull Down (puxada costas)': 'lat-pull-down.jpg',
  'Tríceps na polia (mesma máquina do Lat Pull Down)': 'lat-pull-down.jpg',
  'Rosca bíceps em pé (halter 22,5kg)': 'halter.jpg',
  // 'Leg press 45°': 'leg-press.jpg', // adicionar quando tiver a foto
};

function openPhoto(name) {
  const src = PHOTOS[name];
  const content = document.getElementById('photoContent');
  const cap = document.getElementById('photoCap');
  cap.textContent = name;
  if (src) {
    content.innerHTML = `<img src="${src}" alt="${name}">`;
  } else {
    content.innerHTML = '<div class="no-photo">Ainda sem foto deste aparelho.</div>';
  }
  document.getElementById('photoModal').classList.add('open');
}
function closePhoto() {
  document.getElementById('photoModal').classList.remove('open');
}

async function openHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = '<div class="hist-empty">Carregando histórico...</div>';
  document.getElementById('historyModal').classList.add('open');
  document.querySelector('.history-box h2').textContent = 'HISTÓRICO — ' + currentUser.toUpperCase();

  let history = await fetchSessionsFromSheet();
  if (history === null) {
    // sem internet ou planilha indisponível: usa o backup local deste aparelho
    history = (await storage.get('historyFlat_' + currentUser)) || [];
  }

  container.innerHTML = '';
  if (!history.length) {
    container.innerHTML = '<div class="hist-empty">Nenhum treino finalizado ainda.</div>';
  } else {
    // mais recente primeiro
    const ordered = [...history].reverse();
    ordered.forEach((session, idx) => {
      const d = new Date(session.date);
      const dateStr = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const totalSets = session.exercises.reduce((a, e) => a + e.setsCompleted, 0);
      const totalPlanned = session.exercises.reduce((a, e) => a + e.sets, 0);

      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = `
        <div class="hist-head" onclick="this.parentElement.classList.toggle('open')">
          <div>
            <div class="hist-date">${dateStr}</div>
            <div class="hist-sub">${timeStr} · ${totalSets}/${totalPlanned} séries completas</div>
          </div>
          <div class="hist-arrow">▾</div>
        </div>
        <div class="hist-body">
          <div class="hist-cardio">
            ${session.warmup ? '✓' : '✕'} Aquecimento (5 min) &nbsp;·&nbsp; ${session.cooldown ? '✓' : '✕'} Esteira final (30 min)
          </div>
          ${session.exercises.map(e => `
            <div class="hist-ex-row">
              <span class="hist-ex-name">${e.name}</span>
              <span class="hist-ex-detail">${e.weight}kg · ${e.setsCompleted}/${e.sets}x${e.reps}</span>
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(item);
    });
  }
  document.getElementById('historyModal').classList.add('open');
}
function closeHistory() {
  document.getElementById('historyModal').classList.remove('open');
}

// ---- Sincronização com Google Sheets ----
async function sendSessionToSheet(session) {
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...session, user: currentUser })
    });
    return true;
  } catch (err) {
    console.error('Falha ao enviar treino pra planilha:', err);
    return false;
  }
}

async function fetchSessionsFromSheet() {
  try {
    const res = await fetch(SHEET_URL + '?user=' + encodeURIComponent(currentUser));
    if (!res.ok) throw new Error('resposta não ok');
    return await res.json();
  } catch (err) {
    console.error('Falha ao buscar histórico da planilha:', err);
    return null;
  }
}

async function fetchPlanFromSheet() {
  try {
    const res = await fetch(SHEET_URL + '?type=plan&user=' + encodeURIComponent(currentUser));
    if (!res.ok) throw new Error('resposta não ok');
    return await res.json(); // array de exercícios, ou null se nunca salvo
  } catch (err) {
    console.error('Falha ao buscar plano da planilha:', err);
    return null;
  }
}

async function sendPlanToSheet(list) {
  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ type: 'plan', user: currentUser, exercises: list })
    });
  } catch (err) {
    console.error('Falha ao enviar plano pra planilha:', err);
  }
}

function buildDefaults() {
  const mk = (name, sets, reps, weight) => ({ id: uid(), name, sets, reps, weight });
  return [
    mk('Back Extension (lombar)', 3, 10, 0),
    mk('Dip Machine (tríceps/peito)', 3, 10, 0),
    mk('Lat Pull Down (puxada costas)', 3, 10, 0),
    mk('Tríceps na polia (mesma máquina do Lat Pull Down)', 3, 10, 0),
    mk('Rosca bíceps em pé (halter 22,5kg)', 3, 10, 0),
    mk('Leg press 45°', 3, 10, 0),
  ];
}

let exercises = [];
let checks = {};
let cardio = { warmup: false, cooldown: false };
let lastWeights = {};

function renderCardio() {
  document.getElementById('warmupCheck').classList.toggle('done', !!cardio.warmup);
  document.getElementById('cooldownCheck').classList.toggle('done', !!cardio.cooldown);
}

async function toggleCardio(which) {
  cardio[which] = !cardio[which];
  renderCardio();
  await storage.set('cardio_' + currentUser, cardio);
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!exercises.length) {
    list.innerHTML = '<div class="empty">Nenhum exercício ainda.<br>Adicione o primeiro abaixo.</div>';
    return;
  }
  exercises.forEach(ex => {
    const card = document.createElement('div');
    card.className = 'card';
    const lw = lastWeights[ex.id];
    const doneArr = checks[ex.id] || Array(ex.sets).fill(false);
    checks[ex.id] = doneArr;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="ex-name" onclick="openPhoto('${ex.name.replace(/'/g, "\\'")}')">${ex.name}</div>
          <div class="ex-meta">${ex.sets}x${ex.reps}${lw !== undefined ? ' · último: <span class="last">' + lw + 'kg</span>' : ''}</div>
        </div>
        <button class="del-btn" onclick="delExercise('${ex.id}')">✕</button>
      </div>
      <div class="row2">
        <div class="weight-field">
          <label>Peso</label>
          <input type="number" value="${ex.weight}" onchange="updateWeight('${ex.id}', this.value)">
        </div>
        <div class="sets" id="sets-${ex.id}"></div>
      </div>
    `;
    list.appendChild(card);
    const setsWrap = card.querySelector(`#sets-${ex.id}`);
    doneArr.forEach((done, i) => {
      const dot = document.createElement('div');
      dot.className = 'set-dot' + (done ? ' done' : '');
      dot.textContent = i + 1;
      dot.onclick = () => {
        doneArr[i] = !doneArr[i];
        renderList();
        persistChecks();
      };
      setsWrap.appendChild(dot);
    });
  });
}

function toggleForm(open) {
  document.getElementById('addForm').classList.toggle('open', open);
}

async function addExercise() {
  const name = document.getElementById('fName').value.trim();
  const sets = parseInt(document.getElementById('fSets').value) || 3;
  const reps = parseInt(document.getElementById('fReps').value) || 10;
  const weight = parseFloat(document.getElementById('fWeight').value) || 0;
  if (!name) return;
  const id = uid();
  exercises.push({ id, name, sets, reps, weight });
  checks[id] = Array(sets).fill(false);
  document.getElementById('fName').value = '';
  toggleForm(false);
  await persistExercises();
  sendPlanToSheet(exercises); // sincroniza com outros aparelhos
  renderList();
}

async function delExercise(id) {
  exercises = exercises.filter(e => e.id !== id);
  delete checks[id];
  await persistExercises();
  await persistChecks();
  sendPlanToSheet(exercises); // sincroniza com outros aparelhos
  renderList();
}

async function updateWeight(id, val) {
  const ex = exercises.find(e => e.id === id);
  if (ex) ex.weight = parseFloat(val) || 0;
  await persistExercises();
  sendPlanToSheet(exercises); // sincroniza com outros aparelhos
}

async function persistExercises() { await storage.set('exercisesFlat_' + currentUser, exercises); }
async function persistChecks() { await storage.set('checksFlat_' + currentUser, checks); }
async function persistLastWeights() { await storage.set('lastWeightsFlat_' + currentUser, lastWeights); }

async function finishSession() {
  if (!exercises.length) return;
  exercises.forEach(ex => { lastWeights[ex.id] = ex.weight; });
  await persistLastWeights();

  const history = (await storage.get('historyFlat_' + currentUser)) || [];
  const newSession = {
    date: new Date().toISOString(),
    warmup: !!cardio.warmup,
    cooldown: !!cardio.cooldown,
    exercises: exercises.map(ex => {
      const doneArr = checks[ex.id] || [];
      return {
        name: ex.name,
        sets: ex.sets,
        reps: ex.reps,
        weight: ex.weight,
        setsCompleted: doneArr.filter(Boolean).length
      };
    })
  };
  history.push(newSession);
  await storage.set('historyFlat_' + currentUser, history);
  sendSessionToSheet(newSession); // envia em segundo plano, não bloqueia a UI

  // reset checks e cardio para a próxima vez
  exercises.forEach(ex => { checks[ex.id] = Array(ex.sets).fill(false); });
  cardio = { warmup: false, cooldown: false };
  await persistChecks();
  await storage.set('cardio_' + currentUser, cardio);
  renderList();
  renderCardio();
  showToast('Treino salvo');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ---- Rest / cardio timer ----
let timerSeconds = 90;
let timerRemaining = 90;
let timerInterval = null;

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return m + ':' + sec;
}
function updateTimerDisplay() {
  document.getElementById('timerDisplay').textContent = formatTime(timerRemaining);
}
function setTimer(s) {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSeconds = s;
  timerRemaining = s;
  document.getElementById('timerBtn').textContent = 'Iniciar';
  updateTimerDisplay();
}
function toggleTimer() {
  const btn = document.getElementById('timerBtn');
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    btn.textContent = 'Continuar';
    return;
  }
  btn.textContent = 'Pausar';
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      btn.textContent = 'Iniciar';
      timerRemaining = timerSeconds;
      updateTimerDisplay();
      showToast('Tempo terminado');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  }, 1000);
}
function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRemaining = timerSeconds;
  document.getElementById('timerBtn').textContent = 'Iniciar';
  updateTimerDisplay();
}
updateTimerDisplay();

// ---- carregar dados do usuário selecionado ----
async function loadUserData() {
  const savedChecks = await storage.get('checksFlat_' + currentUser);
  const savedLW = await storage.get('lastWeightsFlat_' + currentUser);
  const savedCardio = await storage.get('cardio_' + currentUser);

  // tenta buscar o plano (lista de exercícios + pesos) da planilha primeiro
  const remotePlan = await fetchPlanFromSheet();
  if (remotePlan && remotePlan.length) {
    exercises = remotePlan;
    await persistExercises(); // guarda cópia local como cache
  } else {
    const savedEx = await storage.get('exercisesFlat_' + currentUser);
    if (savedEx && savedEx.length) {
      exercises = savedEx;
    } else {
      exercises = buildDefaults();
      await persistExercises();
      sendPlanToSheet(exercises); // primeira vez: já popula a planilha
    }
  }

  checks = savedChecks || {};
  lastWeights = savedLW || {};
  cardio = savedCardio || { warmup: false, cooldown: false };

  renderList();
  renderCardio();
}

// ---- init ----
(async function init() {
  document.getElementById('today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  if (currentUser) {
    document.getElementById('currentUserLabel').textContent = 'Trocar usuário (' + currentUser + ')';
    document.getElementById('userScreen').classList.add('hidden');
    await loadUserData();
  } else {
    await showUserScreen();
  }
})();
</script>
